version: "2"

linters:
  default: none
  enable:
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused
    - revive
    - gosec
    - gocritic
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: receiver-naming

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
        text: "Error return value of .* is not checked"

formatters:
  enable:
    - gofmt
    - goimports
