name: Tests

on:
  push:
    branches: [main, gui-rework]
  pull_request:
    branches: [main, gui-rework]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webgui/package-lock.json

      - name: Install frontend dependencies
        run: cd webgui && npm ci

      - name: Build frontend
        run: cd webgui && npm run build

      - name: Run Vue tests
        run: cd webgui && npm run test

      - name: Run Go tests
        run: go test -short ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/wdbgp
