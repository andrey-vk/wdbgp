name: Publish Docker Image

on:
  release:
    types: [prereleased, released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push_to_registry:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/wdbgp
          # The last entry pushes only a throwaway "test" tag on manual
          # dispatch — for testing the release pipeline (e.g. attestation
          # manifests vs RouterOS pulls) without touching the tags users
          # pull. Kept outside the block scalar: lines in there are action
          # input, not YAML comments (the pinned action filters #-lines,
          # but don't rely on it).
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=alpha,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v5
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Docker Scout CLI
        run: |
          curl -fsSL -o /tmp/scout.tar.gz \
            https://github.com/docker/scout-cli/releases/download/v1.23.1/docker-scout_1.23.1_linux_amd64.tar.gz
          echo "0f778f9d833f28bc6cccff95e33039849c0afcecafa38d9f46fe74bfd0915714  /tmp/scout.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.docker/cli-plugins"
          tar -xzf /tmp/scout.tar.gz -C "$HOME/.docker/cli-plugins" docker-scout
          chmod +x "$HOME/.docker/cli-plugins/docker-scout"

      - name: Attach OpenVEX attestation
        # Ships the repo's VEX exceptions (.vex/openvex.vex.json) with the
        # image, so OpenVEX-aware scanners suppress advisories we've
        # verified don't apply — e.g. GO-2026-5932, which flags all of
        # golang.org/x/crypto forever while only bcrypt is linked. Must be
        # an attestation: Scout ignores VEX files embedded in the image
        # filesystem once provenance/SBOM attestations exist. All tags
        # pushed above share one index digest, so attaching via the first
        # tag covers every tag of this release.
        #
        # KNOWN LIMITATION: the Scout *platform* (Hub badge, dashboard)
        # currently does not ingest attestation-based VEX for multi-arch
        # images (long-standing upstream issue, forums.docker.com/t/143422
        # — verified 2026-07-09: attach + readback succeed, exception never
        # applies, with or without --org). The Hub badge is covered by an
        # org-level dashboard exception instead; this attestation is the
        # portable, in-repo record and takes over if Docker fixes ingestion.
        run: |
          FIRST_TAG="$(printf '%s\n' "${TAGS}" | head -n1)"
          docker scout attestation add \
            --org "${DOCKERHUB_ORG}" \
            --file .vex/openvex.vex.json \
            --predicate-type https://openvex.dev/ns/v0.2.0 \
            "${FIRST_TAG}"
          docker scout attestation get \
            --predicate-type https://openvex.dev/ns/v0.2.0 \
            "${FIRST_TAG}" > /dev/null
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/wdbgp
          readme-filepath: ./dockerhub-description.md
          short-description: |
            Downloads CIDR feeds, announces BGP prefixes to routers. Single Go binary.

